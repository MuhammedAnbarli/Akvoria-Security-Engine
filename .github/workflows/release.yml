name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test before packaging
        run: |
          python -m compileall -q core modules main.py tests
          python -m unittest discover -s tests -t .

      - name: Build source archive
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          skip_dirs = {"__pycache__", "storage", ".git", "dist", "build"}
          root = Path(".")
          with zipfile.ZipFile("AKVORIA-ASE-SOURCE.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if any(part in skip_dirs for part in path.parts):
                      continue
                  if path.is_file() and path.name != "AKVORIA-ASE-SOURCE.zip":
                      zf.write(path, path.as_posix())
          PY

      - name: Checksums
        run: sha256sum AKVORIA-ASE-SOURCE.zip > AKVORIA-ASE-SOURCE.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: akvoria-ase-source
          path: |
            AKVORIA-ASE-SOURCE.zip
            AKVORIA-ASE-SOURCE.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AKVORIA-ASE-SOURCE.zip
            AKVORIA-ASE-SOURCE.zip.sha256
